  <text x="83" y="51" fill="#2778c4" font-family="Arial,sans-serif" font-size="31" font-weight="700">HUB</text>
  <rect x="0" y="82" width="244" height="638" fill="#18395e"/>
  <text x="30" y="139" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">PAINEL DOCENTE</text>
