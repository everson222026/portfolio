<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Conceito visual do feed Dust</title>
  <desc id="desc">Previa conceitual de um feed comunitario para publicar e descobrir objetos curiosos.</desc>
  <rect width="1200" height="720" fill="#eceee8"/>
  <rect width="1200" height="82" fill="#171a18"/>
  <text x="48" y="53" fill="#d7fb5b" font-family="Arial,sans-serif" font-size="31" font-weight="700">DUST</text>
  <text x="143" y="51" fill="#f4f2e9" font-family="Arial,sans-serif" font-size="15">MUSEU DAS COISAS INUTEIS</text>
  <rect x="856" y="22" width="296" height="39" rx="5" fill="#292e29" stroke="#454b44"/>
  <text x="876" y="47" fill="#959d91" font-family="Arial,sans-serif" font-size="14">Buscar objetos curiosos...</text>
  <rect x="48" y="126" width="235" height="530" rx="7" fill="#fff" stroke="#d9ddd4"/>
  <text x="75" y="173" fill="#232821" font-family="Arial,sans-serif" font-size="18" font-weight="700">EXPLORAR</text>
  <text x="75" y="222" fill="#4e574c" font-family="Arial,sans-serif" font-size="16">Feed da comunidade</text>
  <text x="75" y="266" fill="#4e574c" font-family="Arial,sans-serif" font-size="16">Colecao</text>
  <text x="75" y="310" fill="#4e574c" font-family="Arial,sans-serif" font-size="16">Perfis</text>
  <rect x="319" y="126" width="833" height="110" rx="7" fill="#fff" stroke="#d9ddd4"/>
  <text x="350" y="171" fill="#232821" font-family="Arial,sans-serif" font-size="25" font-weight="700">O feed do que nao serve pra nada.</text>
  <text x="350" y="205" fill="#727a6f" font-family="Arial,sans-serif" font-size="15">Uma colecao de objetos, historias e achados improvaveis.</text>
  <g transform="translate(319 260)">
    <rect width="402" height="370" rx="7" fill="#fff" stroke="#d9ddd4"/>
    <rect x="18" y="18" width="366" height="202" rx="5" fill="#e5e9df"/>
    <path d="M175 66c-37 24-39 53-12 87l40 39 37-21-24-42c-8-15-6-32 7-50z" fill="#d3d8ca" stroke="#929a8b" stroke-width="5"/>
    <text x="24" y="258" fill="#272c25" font-family="Arial,sans-serif" font-size="20" font-weight="700">A colher que ja viu dias melhores</text>
    <text x="24" y="290" fill="#778071" font-family="Arial,sans-serif" font-size="14">Um achado sem funcao, mas com historia.</text>
    <text x="24" y="337" fill="#6a745f" font-family="Arial,sans-serif" font-size="14">CONCEITO VISUAL · PUBLICAR · DESCOBRIR</text>
  </g>
  <g transform="translate(750 260)">
    <rect width="402" height="370" rx="7" fill="#fff" stroke="#d9ddd4"/>
    <rect x="18" y="18" width="366" height="202" rx="5" fill="#f0e9db"/>
    <circle cx="199" cy="119" r="62" fill="none" stroke="#c2aa71" stroke-width="18"/>
    <circle cx="199" cy="119" r="31" fill="#f0e9db" stroke="#a58e5c" stroke-width="5"/>
    <text x="24" y="258" fill="#272c25" font-family="Arial,sans-serif" font-size="20" font-weight="700">Tampa sem pote, rumo incerto</text>
    <text x="24" y="290" fill="#778071" font-family="Arial,sans-serif" font-size="14">O museu tambem acolhe pecas perdidas.</text>
    <text x="24" y="337" fill="#6a745f" font-family="Arial,sans-serif" font-size="14">CONCEITO VISUAL · INTERAGIR · COLECIONAR</text>
  </g>
</svg>